{% extends "base.html" %}

{% block title %}Verb Trainer{% endblock %}
{% block content %}

<div class="dashboard-container">
	<div class="card">
		<p>Verbs for today</p>
		<span class="number">{{ verb_count }}</span>
	</div>
	
	<div class="card">
		<p>Streak</p>
		<span class="number">{{ streak }} days</span>
	</div>
	
	<div class="card">
		<p>Learned verbs</p>
		<span class="number">{{ learned_count }}</span>
	</div>
</div>
